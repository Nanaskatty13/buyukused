<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KN Classifieds — Buy & Sell in Ghana</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ===== YOUR EXISTING CSS – unchanged ===== */
        /* (copy all the CSS from your current file – it’s the same) */
        /* I’m omitting the CSS here for brevity – keep yours */
    </style>
</head>
<body>

    <!-- ===== YOUR EXISTING HTML – unchanged ===== -->
    <!-- (all HTML from top to the sell modal remains exactly as you have) -->

    <!-- ================================================================ -->
    <!-- ===== NEW JAVASCRIPT – API CONNECTED ===== -->
    <!-- ================================================================ -->
    <script>
        // ================================================================
        //  API CONFIG – change this to your backend URL
        // ================================================================
        const API_URL = 'http://localhost:5000'; // e.g. 'https://your-backend.onrender.com'

        // ================================================================
        //  STATE
        // ================================================================
        let currentUser = null;
        let token = localStorage.getItem('token');
        let allProducts = [];
        let users = []; // will be fetched from API (not stored locally)
        let notifications = [];
        let messages = JSON.parse(localStorage.getItem('kn_messages') || '[]');
        let cart = JSON.parse(localStorage.getItem('kn_cart') || '[]');
        let searchTimeout = null;
        let currentChatUserId = null;
        let currentImageIndex = 0;
        let galleryImages = [];

        // ================================================================
        //  HELPERS
        // ================================================================
        function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

        function showToast(msg, type = '') {
            document.querySelectorAll('.toast').forEach(el => el.remove());
            const t = document.createElement('div');
            t.className = 'toast' + (type ? ' ' + type : '');
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        function timeSince(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = Math.floor(seconds / 31536000);
            if (interval > 1) return interval + ' years ago';
            interval = Math.floor(seconds / 2592000);
            if (interval > 1) return interval + ' months ago';
            interval = Math.floor(seconds / 86400);
            if (interval > 1) return interval + ' days ago';
            interval = Math.floor(seconds / 3600);
            if (interval > 1) return interval + ' hours ago';
            interval = Math.floor(seconds / 60);
            if (interval > 1) return interval + ' minutes ago';
            return 'just now';
        }

        function formatCurrency(amount) { return 'GH₵ ' + Number(amount).toLocaleString(); }

        // ================================================================
        //  CART (still localStorage)
        // ================================================================
        function saveCart() { localStorage.setItem('kn_cart', JSON.stringify(cart));
            updateCartBadges();
            renderCart(); }

        function updateCartBadges() {
            const total = cart.reduce((s, i) => s + (i.quantity || 1), 0);
            document.getElementById('cartCount').innerText = total;
            document.getElementById('floatingCartCount').innerText = total;
        }

        function renderCart() {
            const list = document.getElementById('cartItemsList');
            const totalEl = document.getElementById('cartTotalPrice');
            if (!list) return;
            if (cart.length === 0) {
                list.innerHTML = '<div class="empty-state">❤️ No saved ads yet.</div>';
                if (totalEl) totalEl.innerText = '₵0.00';
                return;
            }
            let total = 0;
            let html = '';
            cart.forEach(item => {
                const qty = item.quantity || 1;
                const subtotal = item.price * qty;
                total += subtotal;
                html += `
                    <div class="cart-item">
                        <img src="${item.image || 'https://placehold.co/60'}" onerror="this.src='https://placehold.co/60'">
                        <div class="details">
                            <div class="title">${escapeHtml(item.title)}</div>
                            <div class="price">GH₵ ${item.price.toLocaleString()}</div>
                            <div class="qty">
                                <button class="qty-btn" onclick="updateQuantity('${item.productId}', -1)">-</button>
                                <span>${qty}</span>
                                <button class="qty-btn" onclick="updateQuantity('${item.productId}', 1)">+</button>
                                <button class="remove-btn" onclick="removeFromCart('${item.productId}')">🗑️</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
            if (totalEl) totalEl.innerText = `₵${total.toLocaleString()}`;
            updateCartBadges();
        }

        function addToCart(productId) {
            const product = allProducts.find(p => p._id === productId);
            if (!product) return;
            const existing = cart.find(i => i.productId === productId);
            if (existing) { existing.quantity = (existing.quantity || 1) + 1; } else {
                cart.push({ productId: product._id, title: product.title, price: product.price, image: product.image,
                    quantity: 1 });
            }
            saveCart();
            renderCart();
            showToast(`❤️ ${product.title} saved to favorites`, 'success');
            if (currentUser) addNotification(currentUser.id, 'Favorite', `You saved ${product.title}`);
        }

        function updateQuantity(pid, change) {
            const item = cart.find(i => i.productId === pid);
            if (item) {
                const newQ = (item.quantity || 1) + change;
                if (newQ <= 0) { cart = cart.filter(i => i.productId !== pid); } else { item.quantity = newQ; }
                saveCart();
                renderCart();
            }
        }

        function removeFromCart(pid) {
            cart = cart.filter(i => i.productId !== pid);
            saveCart();
            renderCart();
            showToast('Removed from favorites');
        }

        function toggleCart() {
            const overlay = document.getElementById('cartOverlay');
            const panel = document.getElementById('cartPanel');
            overlay.classList.toggle('open');
            panel.classList.toggle('open');
            renderCart();
        }

        function checkoutCart() {
            if (cart.length === 0) { showToast('No saved ads', 'error'); return; }
            let msg = "❤️ *KN Classifieds Favorites* ❤️\n";
            let total = 0;
            cart.forEach(i => {
                const q = i.quantity || 1;
                const sub = i.price * q;
                total += sub;
                msg += `📦 ${i.title} x${q} = GH₵ ${sub.toLocaleString()}\n`;
            });
            msg += `\n💰 TOTAL: GH₵ ${total.toLocaleString()}\n📍 Location: \n📞 Contact: `;
            const phone = currentUser?.phone || '0542928081';
            window.open(`https://wa.me/${phone.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // ================================================================
        //  PRODUCTS – API FUNCTIONS
        // ================================================================
        async function fetchProducts() {
            try {
                const res = await fetch(`${API_URL}/api/products`);
                if (!res.ok) throw new Error('Failed to fetch products');
                allProducts = await res.json();
                return allProducts;
            } catch (err) {
                console.error('Error fetching products:', err);
                showToast('Could not load products', 'error');
                return [];
            }
        }

        async function postProduct(productData) {
            try {
                const res = await fetch(`${API_URL}/api/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(productData)
                });
                if (!res.ok) throw new Error('Failed to post product');
                return await res.json();
            } catch (err) {
                console.error('Error posting product:', err);
                showToast('Failed to post ad', 'error');
                return null;
            }
        }

        // ================================================================
        //  RENDER ADS
        // ================================================================
        function renderAds(products = null) {
            const display = products || allProducts;
            const grid = document.getElementById('adsGridContainer');
            if (!grid) return;
            if (display.length === 0) {
                grid.innerHTML =
                    '<div class="empty-state" style="grid-column:1/-1; padding:30px;">No ads found. Be the first to post!</div>';
                return;
            }
            grid.innerHTML = display.map(p => `
                <div class="product-card">
                    <img src="${p.image || 'https://placehold.co/400x300?text=Ad'}" onerror="this.src='https://placehold.co/400x300'">
                    <div class="info">
                        <div class="title">${escapeHtml(p.title)}</div>
                        <div class="price">${formatCurrency(p.price)}</div>
                        <div class="meta"><span>📍 ${escapeHtml(p.location)}</span><span>${escapeHtml(p.category)}</span></div>
                        <div class="card-actions">
                            <button class="btn-add" onclick="event.stopPropagation(); addToCart('${p._id}')"><i class="fas fa-heart"></i> Save</button>
                            <button class="btn-view" onclick="event.stopPropagation(); viewAd('${p._id}')"><i class="fas fa-eye"></i> View</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ================================================================
        //  VIEW AD (detail modal)
        // ================================================================
        async function viewAd(id) {
            try {
                const res = await fetch(`${API_URL}/api/products/${id}`);
                if (!res.ok) throw new Error('Product not found');
                const product = await res.json();
                openProductDetail(product);
            } catch (err) {
                showToast('Product not found', 'error');
            }
        }

        function openProductDetail(product) {
            // product from API has _id instead of id – adapt
            const images = product.images && product.images.length > 0 ?
                product.images :
                [product.image || 'https://placehold.co/600x400?text=No+Image'];
            galleryImages = images.filter(img => img && img.trim() !== '');
            if (galleryImages.length === 0) {
                galleryImages = ['https://placehold.co/600x400?text=No+Image'];
            }
            currentImageIndex = 0;

            const modal = document.getElementById('productDetailModal');
            const content = document.getElementById('productDetailContent');

            const thumbnailsHtml = galleryImages.map((img, idx) =>
                `<div class="thumb ${idx === 0 ? 'active' : ''}" onclick="setGalleryImage(${idx})">
                    <img src="${img}" alt="Thumbnail ${idx + 1}" loading="lazy">
                </div>`
            ).join('');

            const metaItems = [
                { label: 'Brand', value: product.brand || '—' },
                { label: 'Model', value: product.model || '—' },
                { label: 'Condition', value: product.condition || '—' },
                { label: 'Storage', value: product.storage || '—' },
                { label: 'RAM', value: product.ram || '—' },
                { label: 'Color', value: product.color || '—' },
                { label: 'Views', value: product.views || 0 }
            ];
            const metaHtml = metaItems.map(item =>
                `<div class="meta-item">
                    <span class="label">${item.label}</span>
                    <span class="value">${escapeHtml(String(item.value))}</span>
                </div>`
            ).join('');

            const sellerName = product.sellerName || 'KN Seller';
            const verified = product.verified ? '<i class="fas fa-check-circle verified"></i>' : '';
            const yearsOnPlatform = product.yearsOnPlatform || '1+';
            const sellerPhone = product.sellerPhone || product.phone || '0542928081';
            const sellerLocation = product.location || 'Ghana';
            const timeAgo = product.createdAt ? timeSince(new Date(product.createdAt)) : 'Recently';
            const marketPriceLow = Math.round(product.price * 0.65);
            const marketPriceHigh = Math.round(product.price * 0.72);

            const msgForm = `
                <div class="message-seller-section">
                    <h4><i class="fas fa-comment-dots" style="color:#0055a5;"></i> Message Seller</h4>
                    <textarea id="msgToSeller" placeholder="Type your message here... e.g. Is this still available?"></textarea>
                    <div class="msg-actions">
                        <button class="btn-send-wa" onclick="sendWhatsAppMessage('${sellerPhone}', '${escapeHtml(product.title)}')">
                            <i class="fab fa-whatsapp"></i> Send via WhatsApp
                        </button>
                        <button class="btn-send-notif" onclick="sendMessageToSeller('${product._id}')">
                            <i class="fas fa-paper-plane"></i> Send Message
                        </button>
                    </div>
                </div>
            `;

            content.innerHTML = `
                <div class="product-gallery">
                    <div class="gallery-container" id="galleryContainer">
                        ${product.promo ? '<span class="promo-badge">Promoted</span>' : ''}
                        <button class="gallery-arrow prev" onclick="prevGalleryImage()" id="prevArrow">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <div class="main-image" id="mainImageWrapper">
                            <img src="${galleryImages[0]}" alt="${escapeHtml(product.title)}" id="galleryMainImage">
                        </div>
                        <button class="gallery-arrow next" onclick="nextGalleryImage()" id="nextArrow">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                        <div class="image-counter" id="imageCounter">1 / ${galleryImages.length}</div>
                    </div>
                    <div class="thumbnails" id="galleryThumbnails">
                        ${thumbnailsHtml}
                    </div>
                </div>

                <div class="product-detail-title">${escapeHtml(product.title)}</div>
                <div class="product-detail-location">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>${escapeHtml(product.location || 'Ghana')}</span>
                    <span class="sep">•</span>
                    <span>${timeAgo}</span>
                    <span class="sep">•</span>
                    <span><i class="fas fa-eye"></i> ${product.views || 0} views</span>
                </div>
                <div class="product-detail-price">
                    ${formatCurrency(product.price)}
                    ${product.oldPrice ? `<small>${formatCurrency(product.oldPrice)}</small>` : ''}
                </div>

                <div class="product-detail-meta">${metaHtml}</div>

                <div class="product-detail-description">${escapeHtml(product.description || 'No description provided.')}</div>

                <div class="price-history">
                    <span class="market-price">Market price: <strong>${formatCurrency(marketPriceLow)} ~ ${formatCurrency(marketPriceHigh)}</strong></span>
                    <span><i class="fas fa-chart-line" style="color:#0055a5;"></i> Price History</span>
                </div>

                <div class="seller-section">
                    <div class="seller-info">
                        <div class="seller-name">
                            ${escapeHtml(sellerName)} ${verified}
                            <span style="font-size:14px; font-weight:400; color:#64748b; margin-left:4px;">(${yearsOnPlatform}+ years on KN)</span>
                        </div>
                        <div class="seller-detail">
                            <i class="fas fa-phone"></i> <a href="tel:${sellerPhone}" style="color:#0055a5; font-weight:600;">${sellerPhone}</a>
                        </div>
                        <div class="seller-detail">
                            <i class="fas fa-map-marker-alt"></i> ${escapeHtml(sellerLocation)}
                        </div>
                        <div class="seller-detail">
                            <i class="fas fa-reply"></i> Typically replies within minutes
                        </div>
                        <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
                            <span class="btn-action btn-outline" style="display:inline-block; padding:4px 14px; font-size:12px; cursor:default;"><i class="fas fa-star" style="color:#f59e0b;"></i> 4.8 (111 reviews)</span>
                            <a href="#" class="btn-action btn-outline" style="display:inline-block; padding:4px 14px; font-size:12px;">view all</a>
                        </div>
                    </div>
                    <div class="seller-actions">
                        <button class="btn-action btn-primary" onclick="showToast('Make an offer feature coming soon!')">Make an offer</button>
                        <button class="btn-action btn-success" onclick="window.open('https://wa.me/${sellerPhone}?text=Hello%2C%20I%27m%20interested%20in%20${encodeURIComponent(product.title)}','_blank')"><i class="fab fa-whatsapp"></i> Start chat</button>
                        <button class="btn-action btn-outline" onclick="showToast('Request call back coming soon!')"><i class="fas fa-phone"></i> Request call back</button>
                        <button class="btn-action btn-danger" onclick="showToast('Mark unavailable coming soon!')"><i class="fas fa-ban"></i> Mark unavailable</button>
                        <button class="btn-action btn-outline" onclick="showToast('Report abuse coming soon!')"><i class="fas fa-flag"></i> Report Abuse</button>
                    </div>
                </div>

                ${msgForm}

                <div class="safety-tips">
                    <strong><i class="fas fa-shield-alt"></i> Safety tips</strong>
                    <ul>
                        <li>Avoid paying in advance, even for delivery</li>
                        <li>Meet with the seller at a safe public place</li>
                        <li>Inspect the item and ensure it's exactly what you want</li>
                        <li>Only pay if you're satisfied</li>
                    </ul>
                </div>

                <div class="product-footer-links">
                    <a href="#"><i class="fas fa-plus-circle"></i> Post Ad Like This</a>
                    <a href="#" onclick="showToast('Share feature coming soon!')"><i class="fas fa-share-alt"></i> Share</a>
                </div>
            `;

            updateGalleryArrows();
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            document.addEventListener('keydown', handleGalleryKeydown);
        }

        // ===== GALLERY NAVIGATION =====
        function setGalleryImage(index) {
            if (index < 0 || index >= galleryImages.length) return;
            currentImageIndex = index;
            const mainImg = document.getElementById('galleryMainImage');
            if (mainImg) {
                mainImg.src = galleryImages[index];
                mainImg.alt = `Image ${index + 1}`;
            }
            const counter = document.getElementById('imageCounter');
            if (counter) {
                counter.textContent = `${index + 1} / ${galleryImages.length}`;
            }
            document.querySelectorAll('.thumbnails .thumb').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            updateGalleryArrows();
        }

        function nextGalleryImage() {
            if (currentImageIndex < galleryImages.length - 1) {
                setGalleryImage(currentImageIndex + 1);
            }
        }

        function prevGalleryImage() {
            if (currentImageIndex > 0) {
                setGalleryImage(currentImageIndex - 1);
            }
        }

        function updateGalleryArrows() {
            const prev = document.getElementById('prevArrow');
            const next = document.getElementById('nextArrow');
            if (prev) prev.classList.toggle('disabled', currentImageIndex === 0);
            if (next) next.classList.toggle('disabled', currentImageIndex === galleryImages.length - 1);
        }

        function handleGalleryKeydown(e) {
            if (!document.getElementById('productDetailModal').classList.contains('active')) return;
            if (e.key === 'ArrowLeft') { e.preventDefault();
                prevGalleryImage(); } else if (e.key === 'ArrowRight') { e.preventDefault();
                nextGalleryImage(); } else if (e.key === 'Escape') { closeProductModal(); }
        }

        function closeProductModal() {
            const modal = document.getElementById('productDetailModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
            document.removeEventListener('keydown', handleGalleryKeydown);
            galleryImages = [];
            currentImageIndex = 0;
        }

        // ================================================================
        //  POST AD
        // ================================================================
        function openSellModal() {
            if (!currentUser) { showToast('Please login to post an ad', 'error');
                openAuthModal('login'); return; }
            document.getElementById('sellModal').classList.add('active');
        }

        function closeSellModal() { document.getElementById('sellModal').classList.remove('active'); }

        function postProduct() {
            if (!currentUser) {
                showToast('Please login to post an ad', 'error');
                openAuthModal('login');
                return;
            }
            const title = document.getElementById('productTitle').value.trim();
            const category = document.getElementById('productCategory').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const desc = document.getElementById('productDesc').value.trim();
            const location = document.getElementById('productLocation').value.trim();
            const image = document.getElementById('productImage').value.trim();
            if (!title || !price) { showToast('Title and price required', 'error'); return; }

            const productData = {
                title,
                category,
                price,
                description: desc || 'No description provided.',
                location: location || 'Ghana',
                sellerName: currentUser.name,
                sellerPhone: currentUser.phone || '0542928081',
                image: image || 'https://placehold.co/400x300',
                images: [image || 'https://placehold.co/400x300'],
                // sellerId will be taken from token on backend
            };

            postProduct(productData).then(newProduct => {
                if (newProduct) {
                    closeSellModal();
                    showToast('🎉 Ad published!', 'success');
                    addNotification(currentUser.id, 'Ad Live', `${title} is now visible to buyers.`);
                    // Refresh the product list from API
                    fetchProducts().then(() => renderAds());
                    // Clear form
                    document.getElementById('productTitle').value = '';
                    document.getElementById('productPrice').value = '';
                    document.getElementById('productDesc').value = '';
                    document.getElementById('productLocation').value = '';
                    document.getElementById('productImage').value = '';
                }
            });
        }

        // ================================================================
        //  AUTH – API BASED
        // ================================================================
        function openAuthModal(mode) {
            const container = document.getElementById('authModalContainer');
            const formContainer = document.getElementById('authFormContainer');
            const socialHtml = `
                <button class="social-btn google" onclick="signInWithGoogle()">
                    <i class="fab fa-google"></i> Continue with Google
                </button>
                <button class="social-btn facebook" onclick="signInWithFacebook()">
                    <i class="fab fa-facebook-f"></i> Continue with Facebook
                </button>
                <div class="social-login-divider"><span>or</span></div>
            `;
            if (mode === 'login') {
                formContainer.innerHTML = `
                    <h2>Welcome Back 👋</h2>
                    <div class="subtitle">Login to your account</div>
                    <div id="authError" class="error-message"></div>
                    ${socialHtml}
                    <input type="email" id="loginEmail" placeholder="Email address">
                    <input type="password" id="loginPassword" placeholder="Password">
                    <button onclick="handleLogin()">Login →</button>
                    <div class="auth-footer"><a onclick="openForgotModal()">Forgot Password?</a></div>
                    <div class="auth-footer">No account? <a onclick="switchAuthMode('register')">Create free account</a></div>
                `;
            } else {
                formContainer.innerHTML = `
                    <h2>Join KN Classifieds 🚀</h2>
                    <div class="subtitle">Start posting and replying today</div>
                    <div id="authError" class="error-message"></div>
                    ${socialHtml}
                    <input type="text" id="regName" placeholder="Full name">
                    <input type="email" id="regEmail" placeholder="Email address">
                    <input type="password" id="regPassword" placeholder="Password (min 6 chars)">
                    <input type="tel" id="regPhone" placeholder="Phone number">
                    <button onclick="handleRegister()">Create Account →</button>
                    <div class="auth-footer">Already have account? <a onclick="switchAuthMode('login')">Sign in</a></div>
                `;
            }
            container.classList.add('active');
        }

        function closeAuthModal() { document.getElementById('authModalContainer').classList.remove('active'); }

        function switchAuthMode(mode) { openAuthModal(mode); }

        function showAuthError(msg) {
            const errDiv = document.getElementById('authError');
            if (errDiv) { errDiv.innerText = msg;
                errDiv.style.display = 'block';
                setTimeout(() => { if (errDiv) errDiv.style.display = 'none'; }, 3000); }
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail')?.value.trim();
            const pwd = document.getElementById('loginPassword')?.value;
            if (!email || !pwd) { showAuthError('Fill all fields'); return; }
            fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password: pwd })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                        token = data.token;
                        // data.user contains { id, name, email, phone, photoURL }
                        setCurrentUser(data.user);
                        closeAuthModal();
                        showToast(`Welcome back, ${data.user.name}! 🎉`, 'success');
                        addNotification(data.user.id, 'Login successful', 'You are now logged in.');
                    } else {
                        showAuthError(data.error || 'Invalid credentials');
                    }
                })
                .catch(() => showAuthError('Connection error. Try again.'));
        }

        function handleRegister() {
            const name = document.getElementById('regName')?.value.trim();
            const email = document.getElementById('regEmail')?.value.trim();
            const pwd = document.getElementById('regPassword')?.value;
            const phone = document.getElementById('regPhone')?.value.trim();
            if (!name || !email || !pwd) { showAuthError('All fields required'); return; }
            if (pwd.length < 6) { showAuthError('Password min 6 characters'); return; }
            fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password: pwd, phone })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                        token = data.token;
                        setCurrentUser(data.user);
                        closeAuthModal();
                        showToast(`Welcome, ${data.user.name}! 🎉`, 'success');
                        addNotification(data.user.id, 'Welcome!', 'Post your first ad today.');
                    } else {
                        showAuthError(data.error || 'Registration failed');
                    }
                })
                .catch(() => showAuthError('Connection error.'));
        }

        function signInWithGoogle() {
            window.location.href = `${API_URL}/auth/google`;
        }

        function signInWithFacebook() {
            window.location.href = `${API_URL}/auth/facebook`;
        }

        function handleOAuthRedirect() {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#token=')) {
                const t = hash.substring(7);
                localStorage.setItem('token', t);
                token = t;
                window.location.hash = '';
                fetch(`${API_URL}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                    .then(res => res.json())
                    .then(user => {
                        if (user && user._id) {
                            const localUser = { id: user._id, name: user.name, email: user.email, phone: user.phone || '',
                                photoURL: user.photoURL || '' };
                            setCurrentUser(localUser);
                            showToast(`Welcome, ${localUser.name}! 🎉`, 'success');
                            addNotification(localUser.id, 'Login successful', 'You are now logged in with social account.');
                        }
                    })
                    .catch(err => { console.error(err);
                        showToast('Login failed. Please try again.', 'error'); });
            }
        }

        function setCurrentUser(user) {
            currentUser = user;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            updateUIAfterAuth();
        }

        function logout() {
            fetch(`${API_URL}/auth/logout`, { method: 'POST' }).catch(() => {});
            localStorage.removeItem('token');
            localStorage.removeItem('currentUser');
            currentUser = null;
            token = null;
            updateUIAfterAuth();
            showToast('Logged out');
            cart = [];
            saveCart();
            renderAds();
        }

        function updateUIAfterAuth() {
            if (currentUser) {
                document.getElementById('authGroup').style.display = 'none';
                document.getElementById('userGroup').style.display = 'inline-flex';
                document.getElementById('userNameDisplay').innerHTML = currentUser.name;
                const avatar = document.getElementById('userAvatar');
                const defaultIcon = document.getElementById('defaultAvatar');
                if (currentUser.photoURL && currentUser.photoURL !== '') {
                    avatar.src = currentUser.photoURL;
                    avatar.style.display = 'inline-block';
                    defaultIcon.style.display = 'none';
                } else {
                    avatar.style.display = 'none';
                    defaultIcon.style.display = 'inline-block';
                }
            } else {
                document.getElementById('authGroup').style.display = 'flex';
                document.getElementById('userGroup').style.display = 'none';
            }
            renderNotifications();
            renderMessagesSidebar();
            renderCart();
            updateNotifBadge();
            updateMsgBadge();
        }

        function openForgotModal() {
            closeAuthModal();
            document.getElementById('forgotModal').classList.add('active');
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').classList.remove('active');
        }

        function sendResetEmail() {
            const email = document.getElementById('forgotEmail')?.value.trim();
            if (!email) { showToast('Please enter your email', 'error'); return; }
            showToast('📧 Password reset link sent (demo). Check your console.', 'success');
            console.log(`Reset password for: ${email}`);
            closeForgotModal();
            document.getElementById('forgotEmail').value = '';
        }

        // ================================================================
        //  NOTIFICATIONS – API
        // ================================================================
        function addNotification(userId, title, message) {
            fetch(`${API_URL}/api/notifications`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ userId, title, message })
            }).catch(() => {});
        }

        function renderNotifications() {
            const container = document.getElementById('notifList');
            if (!currentUser) {
                container.innerHTML = '<div class="empty-state">Login to see notifications</div>';
                return;
            }
            fetch(`${API_URL}/api/notifications/${currentUser.id}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            })
                .then(res => res.json())
                .then(data => {
                    const myNotifs = Array.isArray(data) ? data : [];
                    if (myNotifs.length === 0) {
                        container.innerHTML = '<div class="empty-state">🔔 No notifications</div>';
                        return;
                    }
                    container.innerHTML = myNotifs.map(n => `
                        <div class="notif-item ${!n.read ? 'notif-unread' : ''}">
                            <div class="notif-title">${escapeHtml(n.title)}</div>
                            <div class="notif-text">${escapeHtml(n.message)}</div>
                            <div class="notif-time">${new Date(n.timestamp).toLocaleString()}</div>
                            <button class="mark-read-btn" onclick="markNotifRead('${n._id}')" style="background:none; border:none; color:#0055a5; cursor:pointer; margin-top:4px;">✓ Mark read</button>
                        </div>
                    `).join('');
                    updateNotifBadge(myNotifs);
                })
                .catch(() => container.innerHTML = '<div class="empty-state">Error loading notifications</div>');
        }

        function markNotifRead(id) {
            fetch(`${API_URL}/api/notifications/${id}/read`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            })
                .then(() => renderNotifications())
                .catch(() => showToast('Error marking as read', 'error'));
        }

        function updateNotifBadge(notifs) {
            const unread = (notifs || []).filter(n => !n.read).length;
            document.getElementById('notifBadge').innerText = unread;
        }

        // ================================================================
        //  MESSAGES – still localStorage
        // ================================================================
        function sendMessage(receiverId, messageText, images = [], productId = null) {
            if (!currentUser) { showToast('Please login to send a message', 'error'); return false; }
            if (!messageText && images.length === 0) { showToast('Please type a message or add an image', 'error'); return false; }
            const msg = {
                id: Date.now().toString(),
                senderId: currentUser.id,
                receiverId: receiverId,
                productId: productId || null,
                message: messageText || '',
                timestamp: new Date().toISOString(),
                read: false,
                images: images
            };
            messages.push(msg);
            localStorage.setItem('kn_messages', JSON.stringify(messages));
            addNotification(receiverId, '📩 New Message', `${currentUser.name} sent you a message.`);
            if (currentChatUserId === receiverId) renderChatMessages(receiverId);
            updateMsgBadge();
            if (document.getElementById('messageSidebar').classList.contains('open')) renderMessagesSidebar();
            return true;
        }

        function getConversation(otherUserId) {
            if (!currentUser) return [];
            return messages.filter(m =>
                (m.senderId === currentUser.id && m.receiverId === otherUserId) ||
                (m.senderId === otherUserId && m.receiverId === currentUser.id)
            ).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
        }

        function getConversations() {
            if (!currentUser) return [];
            const otherUserIds = new Set();
            messages.forEach(m => {
                if (m.senderId === currentUser.id) otherUserIds.add(m.receiverId);
                if (m.receiverId === currentUser.id) otherUserIds.add(m.senderId);
            });
            const convs = [];
            otherUserIds.forEach(uid => {
                // For now we don't have user data from API; we'll fake it
                const user = { id: uid, name: 'User ' + uid.slice(0, 6), photoURL: '' };
                // We could fetch user details from API but for simplicity we'll keep it minimal
                const msgs = getConversation(uid);
                if (msgs.length === 0) return;
                const last = msgs[msgs.length - 1];
                const unread = msgs.filter(m => m.receiverId === currentUser.id && !m.read).length;
                convs.push({ userId: uid, user, lastMessage: last, unread, messages: msgs });
            });
            convs.sort((a, b) => new Date(b.lastMessage.timestamp) - new Date(a.lastMessage.timestamp));
            return convs;
        }

        function markConversationRead(otherUserId) {
            if (!currentUser) return;
            messages.forEach(m => {
                if (m.senderId === otherUserId && m.receiverId === currentUser.id && !m.read) {
                    m.read = true;
                }
            });
            localStorage.setItem('kn_messages', JSON.stringify(messages));
            updateMsgBadge();
            renderMessagesSidebar();
        }

        function renderMessagesSidebar() {
            const container = document.getElementById('msgList');
            if (!currentUser) {
                container.innerHTML = '<div class="empty-state">Login to see messages</div>';
                return;
            }
            const conversations = getConversations();
            if (conversations.length === 0) {
                container.innerHTML = '<div class="empty-state">💬 No conversations yet.</div>';
                return;
            }
            container.innerHTML = conversations.map(conv => {
                const user = conv.user;
                const avatarHtml = user.photoURL ?
                    `<img src="${user.photoURL}" alt="${escapeHtml(user.name)}">` :
                    `<i class="fas fa-user"></i>`;
                const unreadBadge = conv.unread > 0 ? `<span class="conv-unread-badge">${conv.unread}</span>` : '';
                const time = timeSince(new Date(conv.lastMessage.timestamp));
                const lastMsg = conv.lastMessage.message || (conv.lastMessage.images.length > 0 ? '📷 Image' : '');
                return `
                    <div class="conversation-item ${conv.unread > 0 ? 'unread' : ''}" onclick="openChat('${conv.userId}')">
                        <div class="conv-avatar">${avatarHtml}</div>
                        <div class="conv-info">
                            <div class="conv-name">${escapeHtml(user.name)}</div>
                            <div class="conv-last">${escapeHtml(lastMsg)}</div>
                            <div class="conv-time">${time}</div>
                        </div>
                        ${unreadBadge}
                    </div>
                `;
            }).join('');
        }

        function openChat(otherUserId) {
            if (!currentUser) { showToast('Please login first', 'error'); return; }
            // For now we don't have user details from API – we'll use a placeholder
            const user = { name: 'User ' + otherUserId.slice(0, 6), photoURL: '' };
            currentChatUserId = otherUserId;
            markConversationRead(otherUserId);
            const avatarEl = document.getElementById('chatAvatar');
            if (user.photoURL) {
                avatarEl.innerHTML = `<img src="${user.photoURL}" alt="${escapeHtml(user.name)}">`;
            } else {
                avatarEl.innerHTML = `<i class="fas fa-user"></i>`;
            }
            document.getElementById('chatUserName').textContent = user.name;
            renderChatMessages(otherUserId);
            document.getElementById('chatModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            document.getElementById('chatInput').focus();
        }

        function renderChatMessages(otherUserId) {
            const container = document.getElementById('chatMessages');
            const msgs = getConversation(otherUserId);
            if (msgs.length === 0) {
                container.innerHTML =
                    '<div style="text-align:center; padding:20px; color:#94a3b8; font-size:14px;">No messages yet. Start the conversation!</div>';
                return;
            }
            container.innerHTML = msgs.map(m => {
                const isSent = m.senderId === currentUser.id;
                const time = new Date(m.timestamp).toLocaleString('en-US', { hour: '2-digit', minute: '2-digit' });
                let imagesHtml = '';
                if (m.images && m.images.length > 0) {
                    imagesHtml =
                        `<div class="msg-images">${m.images.map(img => `<img src="${img}" alt="Shared image">`).join('')}</div>`;
                }
                return `
                    <div class="chat-message ${isSent ? 'sent' : 'received'}">
                        ${escapeHtml(m.message)}
                        ${imagesHtml}
                        <span class="msg-time">${time}</span>
                    </div>
                `;
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            const fileInput = document.getElementById('chatImageInput');
            const files = fileInput.files;
            const imagePromises = [];
            if (files.length > 0) {
                for (let file of files) {
                    if (file.size > 5 * 1024 * 1024) {
                        showToast('Image exceeds 5MB limit.', 'error');
                        continue;
                    }
                    const promise = new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = function(e) { resolve(e.target.result); };
                        reader.readAsDataURL(file);
                    });
                    imagePromises.push(promise);
                }
            }
            if (text === '' && imagePromises.length === 0) {
                showToast('Please type a message or add an image', 'error');
                return;
            }
            input.value = '';
            fileInput.value = '';
            if (imagePromises.length > 0) {
                Promise.all(imagePromises).then(imageDataUrls => {
                    const validImages = imageDataUrls.filter(url => url !== null);
                    if (validImages.length > 0 || text !== '') {
                        sendMessage(currentChatUserId, text, validImages);
                        renderChatMessages(currentChatUserId);
                        document.getElementById('chatInput').focus();
                    }
                }).catch(err => { console.error(err);
                    showToast('Error loading images', 'error'); });
            } else {
                sendMessage(currentChatUserId, text, []);
                renderChatMessages(currentChatUserId);
                document.getElementById('chatInput').focus();
            }
        }

        function closeChatModal() {
            document.getElementById('chatModal').classList.remove('active');
            document.body.style.overflow = '';
            currentChatUserId = null;
            document.getElementById('chatImageInput').value = '';
        }

        // ================================================================
        //  MESSAGE SELLER (in product detail)
        // ================================================================
        function sendWhatsAppMessage(phone, productTitle) {
            const msgBox = document.getElementById('msgToSeller');
            let message = msgBox ? msgBox.value.trim() : '';
            if (!message) {
                message = `Hello, I'm interested in your product: ${productTitle}. Is it still available?`;
            }
            const url = `https://wa.me/${phone.replace(/\D/g, '')}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
            if (msgBox) msgBox.value = '';
            showToast('Opening WhatsApp...', 'success');
        }

        function sendMessageToSeller(productId) {
            if (!currentUser) {
                showToast('Please login to send a message', 'error');
                openAuthModal('login');
                return;
            }
            const product = allProducts.find(p => p._id === productId);
            if (!product) { showToast('Product not found', 'error'); return; }
            const msgBox = document.getElementById('msgToSeller');
            const message = msgBox ? msgBox.value.trim() : '';
            if (!message) {
                showToast('Please type a message first', 'error');
                if (msgBox) msgBox.focus();
                return;
            }
            const success = sendMessage(product.sellerId, message, [], productId);
            if (success) {
                showToast(`✅ Message sent to ${product.sellerName}!`, 'success');
                if (msgBox) msgBox.value = '';
                openChat(product.sellerId);
            }
        }

        // ================================================================
        //  SEARCH & FILTER (uses API with query params)
        // ================================================================
        function performSearch() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const location = document.getElementById('locationFilter').value;
            let url = `${API_URL}/api/products?`;
            if (category !== 'all') url += `category=${encodeURIComponent(category)}&`;
            if (location !== 'all') url += `location=${encodeURIComponent(location)}&`;
            if (term) url += `search=${encodeURIComponent(term)}&`;
            url = url.replace(/[?&]$/, '');
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    allProducts = data;
                    renderAds();
                })
                .catch(() => showToast('Search failed', 'error'));
        }

        function searchProducts() {
            performSearch();
            document.getElementById('adsGrid').scrollIntoView({ behavior: 'smooth' });
        }

        // Attach event listeners
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('searchInput').addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(performSearch, 300);
            });
            document.getElementById('categoryFilter').addEventListener('change', performSearch);
            document.getElementById('locationFilter').addEventListener('change', performSearch);
        });

        function filterCategory(cat) {
            document.getElementById('categoryFilter').value = cat === 'all' ? 'all' : cat;
            performSearch();
            document.getElementById('adsGrid').scrollIntoView({ behavior: 'smooth' });
        }

        function loadCategories() {
            const cats = [
                { name: 'All', icon: 'fa-th-large' },
                { name: 'Cars', icon: 'fa-car' },
                { name: 'Phones', icon: 'fa-mobile-alt' },
                { name: 'Real Estate', icon: 'fa-home' },
                { name: 'Jobs', icon: 'fa-briefcase' },
                { name: 'Electronics', icon: 'fa-laptop' },
                { name: 'Fashion', icon: 'fa-tshirt' },
                { name: 'Home', icon: 'fa-couch' },
                { name: 'Other', icon: 'fa-tag' },
            ];
            const container = document.getElementById('categoriesGrid');
            container.innerHTML = cats.map(c =>
                `<div class="cat-card" onclick="filterCategory('${c.name === 'All' ? 'all' : c.name}')">
                    <i class="fas ${c.icon}"></i> ${c.name}
                </div>`
            ).join('');
        }

        // ================================================================
        //  SIDEBARS (notifications & messages)
        // ================================================================
        function toggleSidebar(type) {
            closeAllSidebars();
            const sidebar = type === 'notification' ? document.getElementById('notificationSidebar') :
                type === 'message' ? document.getElementById('messageSidebar') : null;
            if (sidebar) sidebar.classList.add('open');
            if (type === 'notification') renderNotifications();
            if (type === 'message') renderMessagesSidebar();
        }

        function closeAllSidebars() {
            document.querySelectorAll('.sidebar').forEach(s => s.classList.remove('open'));
        }

        function updateMsgBadge() {
            if (!currentUser) return;
            const unread = messages.filter(m => m.receiverId === currentUser.id && !m.read).length;
            document.getElementById('msgBadge').innerText = unread;
        }

        // ================================================================
        //  STICKY SEARCH
        // ================================================================
        let lastScrollY = window.scrollY;
        const searchWrapper = document.getElementById('stickySearchWrapper');

        window.addEventListener('scroll', function() {
            const currentScrollY = window.scrollY;
            if (currentScrollY > lastScrollY && currentScrollY > 100) {
                searchWrapper.classList.add('hidden');
            } else if (currentScrollY < lastScrollY) {
                searchWrapper.classList.remove('hidden');
            }
            lastScrollY = currentScrollY;
            const hero = document.getElementById('heroSearch');
            const heroBottom = hero ? hero.offsetTop + hero.offsetHeight : 0;
            if (window.scrollY > heroBottom - 80) {
                searchWrapper.classList.add('scrolled');
            } else {
                searchWrapper.classList.remove('scrolled');
            }
        });

        // ================================================================
        //  MOBILE NAV TOGGLE
        // ================================================================
        document.getElementById('mobileToggle').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('open');
        });

        // ================================================================
        //  INIT
        // ================================================================
        async function init() {
            handleOAuthRedirect();
            // Load user from token
            const stored = localStorage.getItem('currentUser');
            if (stored) { try { currentUser = JSON.parse(stored); } catch (e) {} }
            token = localStorage.getItem('token') || null;
            if (token && !currentUser) {
                try {
                    const res = await fetch(`${API_URL}/auth/me`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const user = await res.json();
                        currentUser = { id: user._id, name: user.name, email: user.email, phone: user.phone || '',
                            photoURL: user.photoURL || '' };
                        localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    } else {
                        localStorage.removeItem('token');
                        localStorage.removeItem('currentUser');
                        token = null;
                    }
                } catch (e) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('currentUser');
                    token = null;
                }
            }
            updateUIAfterAuth();

            // Load products from API
            await fetchProducts();
            renderAds();

            // Categories (static)
            loadCategories();

            // Cart
            renderCart();
            updateCartBadges();

            // Chat input enter key
            document.getElementById('chatInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendChatMessage();
                }
            });

            console.log('✅ KN Classifieds connected to backend API');
        }
        init();

        // ================================================================
        //  EXPOSE GLOBALS
        // ================================================================
        window.filterCategory = filterCategory;
        window.searchProducts = searchProducts;
        window.openSellModal = openSellModal;
        window.closeSellModal = closeSellModal;
        window.postProduct = postProduct;
        window.viewAd = viewAd;
        window.closeProductModal = closeProductModal;
        window.setGalleryImage = setGalleryImage;
        window.nextGalleryImage = nextGalleryImage;
        window.prevGalleryImage = prevGalleryImage;
        window.sendWhatsAppMessage = sendWhatsAppMessage;
        window.sendMessageToSeller = sendMessageToSeller;
        window.addToCart = addToCart;
        window.updateQuantity = updateQuantity;
        window.removeFromCart = removeFromCart;
        window.checkoutCart = checkoutCart;
        window.toggleCart = toggleCart;
        window.toggleSidebar = toggleSidebar;
        window.closeAllSidebars = closeAllSidebars;
        window.openAuthModal = openAuthModal;
        window.closeAuthModal = closeAuthModal;
        window.switchAuthMode = switchAuthMode;
        window.handleLogin = handleLogin;
        window.handleRegister = handleRegister;
        window.logout = logout;
        window.markNotifRead = markNotifRead;
        window.openForgotModal = openForgotModal;
        window.closeForgotModal = closeForgotModal;
        window.sendResetEmail = sendResetEmail;
        window.signInWithGoogle = signInWithGoogle;
        window.signInWithFacebook = signInWithFacebook;
        window.showToast = showToast;
        window.performSearch = performSearch;
        window.openChat = openChat;
        window.closeChatModal = closeChatModal;
        window.sendChatMessage = sendChatMessage;
    </script>

</body>
