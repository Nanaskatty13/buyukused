<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — KN Classifieds</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ===== YOUR EXISTING CSS ===== */
        /* (copy all your existing styles – they are fine) */
        /* I'm only adding the missing utility classes below */

        /* ===== ADDED UTILITY CLASSES ===== */
        .text-center {
            text-align: center;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .px-3 {
            padding-left: 12px;
            padding-right: 12px;
        }
        .py-1 {
            padding-top: 4px;
            padding-bottom: 4px;
        }

        /* ===== LOADING SPINNER ===== */
        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e9edf2;
            border-top-color: #0055a5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== EXISTING STYLES CONTINUE ===== */
        /* ... your existing styles ... */

    </style>
</head>
<body>

    <!-- ===== YOUR EXISTING HTML ===== -->
    <!-- (keep everything exactly as you have – no changes needed) -->

    <!-- ================================================================ -->
    <!-- ===== FIXED JAVASCRIPT ===== -->
    <!-- ================================================================ -->
    <script>
        // ================================================================
        //  API CONFIG
        // ================================================================
        const API_URL = 'http://localhost:5000'; // change to your backend URL

        // ================================================================
        //  STATE
        // ================================================================
        let token = localStorage.getItem('token');
        let currentUser = null;

        // Users – local fallback (can be replaced with /api/users later)
        let users = JSON.parse(localStorage.getItem('kn_users') || '[]');
        if (!users.find(u => u.email === 'admin@kn.com')) {
            users.push({
                id: 'admin',
                name: 'KN Admin',
                email: 'admin@kn.com',
                password: '123456',
                phone: '0542928081',
                photoURL: '',
                role: 'admin',
                createdAt: new Date().toISOString()
            });
            localStorage.setItem('kn_users', JSON.stringify(users));
        }

        let products = []; // fetched from API
        let notifications = []; // fetched from API

        // Categories – local
        let categories = JSON.parse(localStorage.getItem('kn_categories') || '[]');
        const defaultCategories = [
            { name: 'Cars', icon: 'fa-car' },
            { name: 'Phones', icon: 'fa-mobile-alt' },
            { name: 'Real Estate', icon: 'fa-home' },
            { name: 'Jobs', icon: 'fa-briefcase' },
            { name: 'Electronics', icon: 'fa-laptop' },
            { name: 'Fashion', icon: 'fa-tshirt' },
            { name: 'Home', icon: 'fa-couch' },
            { name: 'Other', icon: 'fa-tag' }
        ];
        if (categories.length === 0) {
            categories = defaultCategories;
            localStorage.setItem('kn_categories', JSON.stringify(categories));
        }

        // ================================================================
        //  HELPERS
        // ================================================================
        function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
        function formatDate(d) { if (!d) return 'N/A'; return new Date(d).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }); }
        function formatCurrency(amount) { return '₵' + Number(amount).toLocaleString(); }

        function getStatusBadge(status) {
            const map = { 'active': 'active', 'pending': 'pending', 'inactive': 'inactive', 'suspended': 'suspended', 'verified': 'verified' };
            return `<span class="status-badge ${map[status] || 'inactive'}">${status.charAt(0).toUpperCase() + status.slice(1)}</span>`;
        }
        function getRoleBadge(role) {
            const map = { 'admin': 'admin', 'seller': 'seller', 'buyer': 'buyer' };
            return `<span class="status-badge ${map[role] || 'buyer'}">${role.charAt(0).toUpperCase() + role.slice(1)}</span>`;
        }

        function showToast(msg, type = '') {
            document.querySelectorAll('.toast').forEach(el => el.remove());
            const t = document.createElement('div');
            t.className = 'toast' + (type ? ' ' + type : '');
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3500);
        }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function openModal(id) { document.getElementById(id).classList.add('active'); }

        // ================================================================
        //  AUTH & PROFILE
        // ================================================================
        function updateAdminProfile() {
            if (currentUser) {
                const initial = (currentUser.name || 'KN Admin').charAt(0).toUpperCase();
                document.getElementById('adminAvatar').textContent = initial;
                document.getElementById('adminName').textContent = currentUser.name || 'KN Admin';
                document.getElementById('adminRole').textContent = 'Super Admin';
                document.getElementById('topAdminAvatar').textContent = initial;
            }
        }

        function logout() {
            fetch(`${API_URL}/auth/logout`, { method: 'POST' }).catch(() => {});
            localStorage.removeItem('token');
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        // ================================================================
        //  FETCH DATA FROM API
        // ================================================================
        async function fetchProducts() {
            try {
                const res = await fetch(`${API_URL}/api/products`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
                products = await res.json();
                return products;
            } catch (err) {
                console.error('Error fetching products:', err);
                showToast('Could not load products: ' + err.message, 'error');
                products = [];
                return [];
            }
        }

        async function fetchNotifications() {
            try {
                const res = await fetch(`${API_URL}/api/notifications/admin`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
                notifications = await res.json();
                return notifications;
            } catch (err) {
                console.error('Error fetching notifications:', err);
                notifications = [];
                return [];
            }
        }

        // ================================================================
        //  PRODUCT CRUD (API)
        // ================================================================
        async function addProduct(productData) {
            try {
                const res = await fetch(`${API_URL}/api/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(productData)
                });
                if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
                return await res.json();
            } catch (err) {
                console.error('Error adding product:', err);
                showToast('Failed to add product: ' + err.message, 'error');
                return null;
            }
        }

        async function updateProduct(productId, productData) {
            try {
                const res = await fetch(`${API_URL}/api/products/${productId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(productData)
                });
                if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
                return await res.json();
            } catch (err) {
                console.error('Error updating product:', err);
                showToast('Failed to update product: ' + err.message, 'error');
                return null;
            }
        }

        async function deleteProduct(productId) {
            try {
                const res = await fetch(`${API_URL}/api/products/${productId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
                return true;
            } catch (err) {
                console.error('Error deleting product:', err);
                showToast('Failed to delete product: ' + err.message, 'error');
                return false;
            }
        }

        // ================================================================
        //  NOTIFICATION CRUD (API)
        // ================================================================
        async function markNotifReadApi(notifId) {
            try {
                const res = await fetch(`${API_URL}/api/notifications/${notifId}/read`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                return res.ok;
            } catch (err) {
                console.error('Error marking read:', err);
                return false;
            }
        }

        async function deleteNotifApi(notifId) {
            try {
                const res = await fetch(`${API_URL}/api/notifications/${notifId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                return res.ok;
            } catch (err) {
                console.error('Error deleting notification:', err);
                return false;
            }
        }

        // ================================================================
        //  DASHBOARD
        // ================================================================
        function renderDashboard() {
            const totalUsers = users.length;
            const totalProducts = products.length;
            const sellers = users.filter(u => u.role === 'seller');
            const totalSellers = sellers.length;
            const totalViews = products.reduce((sum, p) => sum + (p.views || 0), 0);
            const totalRevenue = products.reduce((sum, p) => sum + (p.price || 0), 0);
            const pending = products.filter(p => p.status === 'pending').length;

            document.getElementById('statUsers').textContent = totalUsers;
            document.getElementById('statProducts').textContent = totalProducts;
            document.getElementById('statSellers').textContent = totalSellers;
            document.getElementById('statViews').textContent = totalViews.toLocaleString();
            document.getElementById('statRevenue').textContent = formatCurrency(totalRevenue);
            document.getElementById('statPending').textContent = pending;

            document.getElementById('userBadge').textContent = totalUsers;
            document.getElementById('productBadge').textContent = totalProducts;
            document.getElementById('sellerBadge').textContent = totalSellers;
            document.getElementById('categoryBadge').textContent = categories.length;

            filterDashboardProducts();
        }

        function filterDashboardProducts() {
            const filter = document.getElementById('dashboardCategoryFilter').value;
            let filtered = products;
            if (filter !== 'all') filtered = products.filter(p => p.category === filter);
            const recent = filtered.slice(0, 4);
            const tbody = document.getElementById('dashboardProductsTable');
            if (recent.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;color:#64748b;">No products found</td></tr>`;
                return;
            }
            tbody.innerHTML = recent.map(p => `
                <tr>
                    <td><div style="display:flex;align-items:center;gap:10px;">
                        <img src="${p.image || 'https://placehold.co/60'}" class="product-thumb" onerror="this.src='https://placehold.co/60'">
                        <span>${escapeHtml(p.title)}</span>
                    </div></td>
                    <td>${escapeHtml(p.sellerName || 'Unknown')}</td>
                    <td>${formatCurrency(p.price)}</td>
                    <td>${escapeHtml(p.category || 'Other')}</td>
                    <td>${getStatusBadge(p.status || 'active')}</td>
                    <td><div class="actions-cell">
                        <button class="btn-view" onclick="viewProduct('${p._id}')">View</button>
                        <button class="btn-edit" onclick="editProduct('${p._id}')">Edit</button>
                    </div></td>
                </tr>
            `).join('');
        }

        // ================================================================
        //  USERS (localStorage for now)
        // ================================================================
        function renderUsers() {
            const search = document.getElementById('userSearchInput')?.value.toLowerCase() || '';
            const roleFilter = document.getElementById('userRoleFilter')?.value || 'all';
            let filtered = users;
            if (search) filtered = filtered.filter(u => u.name.toLowerCase().includes(search) || u.email.toLowerCase().includes(search));
            if (roleFilter !== 'all') filtered = filtered.filter(u => (u.role || 'buyer') === roleFilter);

            const tbody = document.getElementById('usersTableBody');
            if (!tbody) return;
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:#64748b;">No users found</td></tr>`;
                return;
            }
            tbody.innerHTML = filtered.map(u => `
                <tr>
                    <td><strong>${escapeHtml(u.name || 'Unknown')}</strong></td>
                    <td>${escapeHtml(u.email)}</td>
                    <td>${escapeHtml(u.phone || '—')}</td>
                    <td>${getRoleBadge(u.role || 'buyer')}</td>
                    <td>${getStatusBadge('active')}</td>
                    <td>${formatDate(u.createdAt)}</td>
                    <td><div class="actions-cell">
                        <button class="btn-edit" onclick="editUser('${u.id}')">Edit</button>
                        <button class="btn-delete" onclick="deleteUser('${u.id}')">Delete</button>
                    </div></td>
                </tr>
            `).join('');
        }

        function openAddUserModal() {
            document.getElementById('userModalTitle').textContent = 'Add User';
            document.getElementById('editUserId').value = '';
            document.getElementById('userForm').reset();
            document.getElementById('userFormPassword').placeholder = 'Enter password';
            document.getElementById('userFormPassword').required = true;
            openModal('userModal');
        }

        function editUser(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) { showToast('User not found', 'error'); return; }
            document.getElementById('userModalTitle').textContent = 'Edit User';
            document.getElementById('editUserId').value = userId;
            document.getElementById('userFormName').value = user.name || '';
            document.getElementById('userFormEmail').value = user.email || '';
            document.getElementById('userFormPassword').value = '';
            document.getElementById('userFormPassword').placeholder = 'Leave blank to keep current';
            document.getElementById('userFormPassword').required = false;
            document.getElementById('userFormPhone').value = user.phone || '';
            document.getElementById('userFormRole').value = user.role || 'buyer';
            openModal('userModal');
        }

        function saveUser(e) {
            e.preventDefault();
            const id = document.getElementById('editUserId').value;
            const name = document.getElementById('userFormName').value.trim();
            const email = document.getElementById('userFormEmail').value.trim();
            const password = document.getElementById('userFormPassword').value;
            const phone = document.getElementById('userFormPhone').value.trim();
            const role = document.getElementById('userFormRole').value;

            if (!name || !email) { showToast('Name and email are required', 'error'); return; }

            if (id) {
                const index = users.findIndex(u => u.id === id);
                if (index === -1) { showToast('User not found', 'error'); return; }
                users[index].name = name;
                users[index].email = email;
                users[index].phone = phone;
                users[index].role = role;
                if (password) users[index].password = password;
                localStorage.setItem('kn_users', JSON.stringify(users));
                showToast('User updated successfully!', 'success');
            } else {
                if (!password) { showToast('Password is required for new users', 'error'); return; }
                if (users.find(u => u.email === email)) { showToast('Email already exists', 'error'); return; }
                users.push({ id: Date.now().toString(), name, email, password, phone, role, createdAt: new Date().toISOString() });
                localStorage.setItem('kn_users', JSON.stringify(users));
                showToast('User added successfully!', 'success');
            }
            closeModal('userModal');
            renderUsers();
            renderDashboard();
            updateAdminProfile();
        }

        function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            const user = users.find(u => u.id === userId);
            if (user && user.role === 'admin') { showToast('Cannot delete the main admin', 'error'); return; }
            users = users.filter(u => u.id !== userId);
            localStorage.setItem('kn_users', JSON.stringify(users));
            renderUsers();
            renderDashboard();
            showToast('User deleted', 'success');
        }

        // ================================================================
        //  PRODUCTS (API)
        // ================================================================
        function renderProducts() {
            const search = document.getElementById('productSearchInput')?.value.toLowerCase() || '';
            const categoryFilter = document.getElementById('productCategoryFilter')?.value || 'all';
            let filtered = products;
            if (search) filtered = filtered.filter(p => p.title.toLowerCase().includes(search));
            if (categoryFilter !== 'all') filtered = filtered.filter(p => p.category === categoryFilter);

            const tbody = document.getElementById('productsTableBody');
            if (!tbody) return;
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:#64748b;">No products found</td></tr>`;
                return;
            }
            tbody.innerHTML = filtered.map(p => `
                <tr>
                    <td><div style="display:flex;align-items:center;gap:10px;">
                        <img src="${p.image || 'https://placehold.co/60'}" class="product-thumb" onerror="this.src='https://placehold.co/60'">
                        <span>${escapeHtml(p.title)}</span>
                    </div></td>
                    <td>${escapeHtml(p.sellerName || 'Unknown')}</td>
                    <td>${formatCurrency(p.price)}</td>
                    <td>${escapeHtml(p.category || 'Other')}</td>
                    <td>${getStatusBadge(p.status || 'active')}</td>
                    <td>${p.views || 0}</td>
                    <td><div class="actions-cell">
                        <button class="btn-view" onclick="viewProduct('${p._id}')">View</button>
                        <button class="btn-edit" onclick="editProduct('${p._id}')">Edit</button>
                        <button class="btn-delete" onclick="deleteProductHandler('${p._id}')">Delete</button>
                    </div></td>
                </tr>
            `).join('');
        }

        function viewProduct(id) {
            const product = products.find(p => p._id === id);
            if (!product) { showToast('Product not found', 'error'); return; }
            showToast(`📦 ${product.title} - ${formatCurrency(product.price)}`);
        }

        function openAddProductModal() {
            document.getElementById('productModalTitle').textContent = 'Add Product';
            document.getElementById('editProductId').value = '';
            document.getElementById('productForm').reset();
            document.getElementById('productFormStatus').value = 'active';
            openModal('productModal');
        }

        function editProduct(id) {
            const product = products.find(p => p._id === id);
            if (!product) { showToast('Product not found', 'error'); return; }
            document.getElementById('productModalTitle').textContent = 'Edit Product';
            document.getElementById('editProductId').value = id;
            document.getElementById('productFormTitle').value = product.title || '';
            document.getElementById('productFormPrice').value = product.price || '';
            document.getElementById('productFormCategory').value = product.category || 'Other';
            document.getElementById('productFormLocation').value = product.location || '';
            document.getElementById('productFormDescription').value = product.description || '';
            document.getElementById('productFormSeller').value = product.sellerName || '';
            document.getElementById('productFormStatus').value = product.status || 'active';
            openModal('productModal');
        }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('editProductId').value;
            const title = document.getElementById('productFormTitle').value.trim();
            const price = parseFloat(document.getElementById('productFormPrice').value);
            const category = document.getElementById('productFormCategory').value;
            const location = document.getElementById('productFormLocation').value.trim();
            const description = document.getElementById('productFormDescription').value.trim();
            const sellerName = document.getElementById('productFormSeller').value.trim();
            const status = document.getElementById('productFormStatus').value;

            if (!title || !price) { showToast('Title and price are required', 'error'); return; }

            const payload = { title, price, category, location, description, sellerName, status };

            let result;
            if (id) {
                result = await updateProduct(id, payload);
            } else {
                result = await addProduct(payload);
            }

            if (result) {
                closeModal('productModal');
                showToast(id ? 'Product updated!' : 'Product added!', 'success');
                await fetchProducts();
                renderProducts();
                renderDashboard();
                renderReports();
                renderCategories();
            }
        }

        async function deleteProductHandler(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            const success = await deleteProduct(id);
            if (success) {
                await fetchProducts();
                renderProducts();
                renderDashboard();
                renderReports();
                renderCategories();
                showToast('Product deleted', 'success');
            }
        }

        // ================================================================
        //  SELLERS (derived from users)
        // ================================================================
        function renderSellers() {
            const search = document.getElementById('sellerSearchInput')?.value.toLowerCase() || '';
            let sellers = users.filter(u => u.role === 'seller');
            if (search) sellers = sellers.filter(u => u.name.toLowerCase().includes(search) || u.email.toLowerCase().includes(search));

            const tbody = document.getElementById('sellersTableBody');
            if (!tbody) return;
            if (sellers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:#64748b;">No sellers found</td></tr>`;
                return;
            }
            tbody.innerHTML = sellers.map(s => {
                const productCount = products.filter(p => p.sellerId === s.id).length;
                const status = productCount > 0 ? 'active' : 'pending';
                return `
                    <tr>
                        <td><strong>${escapeHtml(s.name || 'Unknown')}</strong></td>
                        <td>${escapeHtml(s.email)}</td>
                        <td>${escapeHtml(s.phone || '—')}</td>
                        <td>${productCount}</td>
                        <td>${getStatusBadge(status)}</td>
                        <td>${formatDate(s.createdAt)}</td>
                        <td><div class="actions-cell">
                            <button class="btn-edit" onclick="editSeller('${s.id}')">Edit</button>
                            <button class="btn-delete" onclick="deleteSeller('${s.id}')">Delete</button>
                        </div></td>
                    </tr>
                `;
            }).join('');
        }

        function openAddSellerModal() {
            document.getElementById('userModalTitle').textContent = 'Add Seller';
            document.getElementById('editUserId').value = '';
            document.getElementById('userForm').reset();
            document.getElementById('userFormPassword').placeholder = 'Enter password';
            document.getElementById('userFormPassword').required = true;
            document.getElementById('userFormRole').value = 'seller';
            openModal('userModal');
        }

        function editSeller(id) { editUser(id);
            setTimeout(() => document.getElementById('userFormRole').value = 'seller', 100); }

        function deleteSeller(id) {
            if (!confirm('Are you sure you want to delete this seller?')) return;
            const user = users.find(u => u.id === id);
            if (user) { user.role = 'buyer';
                localStorage.setItem('kn_users', JSON.stringify(users));
                renderSellers();
                renderUsers();
                renderDashboard();
                showToast('Seller removed', 'success'); }
        }

        // ================================================================
        //  CATEGORIES (localStorage)
        // ================================================================
        function renderCategories() {
            const grid = document.getElementById('categoryGrid');
            if (!grid) return;
            if (categories.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center;padding:40px;color:#64748b;">No categories yet. Add your first category!</div>`;
                return;
            }
            grid.innerHTML = categories.map(c => {
                const count = products.filter(p => p.category === c.name).length;
                return `
                    <div class="category-item">
                        <span class="cat-icon"><i class="fas ${c.icon || 'fa-tag'}"></i></span>
                        <div class="cat-name">${escapeHtml(c.name)}</div>
                        <div class="cat-count">${count} products</div>
                        <div class="cat-actions">
                            <button onclick="editCategory('${escapeHtml(c.name)}')"><i class="fas fa-pen"></i></button>
                            <button class="delete-cat" onclick="deleteCategory('${escapeHtml(c.name)}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('categoryBadge').textContent = categories.length;
        }

        function openAddCategoryModal() {
            document.getElementById('categoryModalTitle').textContent = 'Add Category';
            document.getElementById('editCategoryName').value = '';
            document.getElementById('categoryForm').reset();
            document.getElementById('categoryFormIcon').value = 'fa-tag';
            openModal('categoryModal');
        }

        function editCategory(name) {
            const cat = categories.find(c => c.name === name);
            if (!cat) { showToast('Category not found', 'error'); return; }
            document.getElementById('categoryModalTitle').textContent = 'Edit Category';
            document.getElementById('editCategoryName').value = name;
            document.getElementById('categoryFormName').value = cat.name;
            document.getElementById('categoryFormIcon').value = cat.icon || 'fa-tag';
            openModal('categoryModal');
        }

        function saveCategory(e) {
            e.preventDefault();
            const oldName = document.getElementById('editCategoryName').value;
            const name = document.getElementById('categoryFormName').value.trim();
            const icon = document.getElementById('categoryFormIcon').value.trim();

            if (!name) { showToast('Category name is required', 'error'); return; }

            if (oldName) {
                const index = categories.findIndex(c => c.name === oldName);
                if (index === -1) { showToast('Category not found', 'error'); return; }
                categories[index].name = name;
                categories[index].icon = icon || 'fa-tag';
                localStorage.setItem('kn_categories', JSON.stringify(categories));
                showToast('Category updated!', 'success');
                renderCategories();
                renderDashboard();
                fetchProducts().then(() => {
                    renderProducts();
                    renderReports();
                });
            } else {
                if (categories.find(c => c.name === name)) { showToast('Category already exists', 'error'); return; }
                categories.push({ name, icon: icon || 'fa-tag' });
                localStorage.setItem('kn_categories', JSON.stringify(categories));
                showToast('Category added!', 'success');
                renderCategories();
                renderDashboard();
            }
            closeModal('categoryModal');
        }

        function deleteCategory(name) {
            if (name === 'Other') { showToast('Cannot delete the "Other" category', 'error'); return; }
            if (!confirm(`Delete category "${name}"? Products will be moved to "Other".`)) return;
            categories = categories.filter(c => c.name !== name);
            localStorage.setItem('kn_categories', JSON.stringify(categories));
            renderCategories();
            renderDashboard();
            showToast(`Category "${name}" deleted`, 'success');
            fetchProducts().then(() => {
                renderProducts();
                renderReports();
            });
        }

        // ================================================================
        //  REPORTS
        // ================================================================
        function renderReports() {
            document.getElementById('reportProducts').textContent = products.length;
            document.getElementById('reportUsers').textContent = users.length;
            document.getElementById('reportRevenue').textContent = formatCurrency(products.reduce((s, p) => s + (p.price || 0), 0));
            document.getElementById('reportPending').textContent = products.filter(p => p.status === 'pending').length;

            const container = document.getElementById('topCategoriesContainer');
            if (!container) return;
            const catCounts = categories.map(c => ({ name: c.name, count: products.filter(p => p.category === c.name).length, icon: c.icon || 'fa-tag' }))
                .sort((a, b) => b.count - a.count).slice(0, 5);
            if (catCounts.length === 0) {
                container.innerHTML = '<div style="color:#94a3b8;text-align:center;padding:10px;">No data</div>';
                return;
            }
            const maxCount = Math.max(...catCounts.map(c => c.count), 1);
            container.innerHTML = catCounts.map(c => {
                const pct = Math.round((c.count / maxCount) * 100);
                return `
                    <div>
                        <span style="font-weight:600;"><i class="fas ${c.icon}"></i> ${escapeHtml(c.name)}</span>
                        <span style="float:right; font-weight:700;">${c.count}</span>
                        <div style="height:6px; background:#e9edf2; border-radius:4px; margin-top:2px;">
                            <div style="height:6px; width:${pct}%; background:#0055a5; border-radius:4px;"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ================================================================
        //  NOTIFICATIONS (API)
        // ================================================================
        async function toggleNotificationPanel() {
            const panel = document.getElementById('notificationPanel');
            if (panel.classList.contains('active')) {
                closeModal('notificationPanel');
            } else {
                document.getElementById('notificationList').innerHTML = '<div class="text-center"><div class="loading-spinner"></div><div class="mt-2">Loading...</div></div>';
                await fetchNotifications();
                renderNotifications();
                openModal('notificationPanel');
            }
        }

        function renderNotifications() {
            const container = document.getElementById('notificationList');
            if (!container) return;
            const adminNotifs = notifications.filter(n => n.userId === 'admin' || n.userId === 'all').sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            if (adminNotifs.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:30px;color:#94a3b8;">🔔 No notifications</div>';
                return;
            }
            container.innerHTML = adminNotifs.map(n => `
                <div style="padding:12px;background:${!n.read ? '#eef2ff' : '#f8fafc'};border-radius:12px;margin-bottom:8px;border-left:3px solid #2ecc71;">
                    <div style="font-weight:700;">${escapeHtml(n.title)}</div>
                    <div style="font-size:13px;color:#475569;">${escapeHtml(n.message)}</div>
                    <div style="font-size:10px;color:#94a3b8;margin-top:4px;">${new Date(n.timestamp).toLocaleString()}</div>
                    <div style="margin-top:6px;display:flex;gap:6px;">
                        ${!n.read ? `<button onclick="markNotifRead('${n._id}')" style="padding:2px 12px;background:#0055a5;color:#fff;border:none;border-radius:12px;font-size:11px;cursor:pointer;">Mark read</button>` : ''}
                        <button onclick="deleteNotif('${n._id}')" style="padding:2px 12px;background:#fee2e2;color:#dc2626;border:none;border-radius:12px;font-size:11px;cursor:pointer;">Delete</button>
                    </div>
                </div>
            `).join('');

            const unread = adminNotifs.filter(n => !n.read).length;
            document.getElementById('notifBadgeTop').textContent = unread;
        }

        async function markNotifRead(id) {
            const success = await markNotifReadApi(id);
            if (success) {
                await fetchNotifications();
                renderNotifications();
            }
        }

        async function deleteNotif(id) {
            if (!confirm('Delete notification?')) return;
            const success = await deleteNotifApi(id);
            if (success) {
                await fetchNotifications();
                renderNotifications();
            }
        }

        // ================================================================
        //  SETTINGS (localStorage)
        // ================================================================
        function saveSettings() {
            const settings = {
                siteName: document.getElementById('settingsSiteName').value.trim(),
                siteDesc: document.getElementById('settingsSiteDesc').value.trim(),
                email: document.getElementById('settingsContactEmail').value.trim(),
                phone: document.getElementById('settingsContactPhone').value.trim(),
                maintenance: document.getElementById('settingsMaintenance').checked,
                registration: document.getElementById('settingsRegistration').checked,
                approval: document.getElementById('settingsApproval').checked,
                updatedAt: new Date().toISOString()
            };
            localStorage.setItem('kn_settings', JSON.stringify(settings));
            showToast('Settings saved!', 'success');
        }

        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('kn_settings') || '{}');
            if (settings.siteName) document.getElementById('settingsSiteName').value = settings.siteName;
            if (settings.siteDesc) document.getElementById('settingsSiteDesc').value = settings.siteDesc;
            if (settings.email) document.getElementById('settingsContactEmail').value = settings.email;
            if (settings.phone) document.getElementById('settingsContactPhone').value = settings.phone;
            if (settings.maintenance) document.getElementById('settingsMaintenance').checked = true;
            if (settings.registration !== undefined) document.getElementById('settingsRegistration').checked = settings.registration;
            if (settings.approval) document.getElementById('settingsApproval').checked = true;
        }

        // ================================================================
        //  PAGE NAVIGATION
        // ================================================================
        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById('page-' + pageId);
            if (target) target.classList.add('active');
            document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.page === pageId) item.classList.add('active');
            });
            const titles = {
                dashboard: 'Dashboard <small>Overview</small>',
                users: 'Users <small>Manage all users</small>',
                products: 'Products <small>Manage all products</small>',
                sellers: 'Sellers <small>Manage all sellers</small>',
                categories: 'Categories <small>Manage categories</small>',
                reports: 'Reports <small>Analytics & insights</small>',
                settings: 'Settings <small>System configuration</small>'
            };
            document.getElementById('pageTitle').innerHTML = titles[pageId] || 'Dashboard';
            if (window.innerWidth <= 992) closeSidebar();
            if (pageId === 'dashboard') renderDashboard();
            if (pageId === 'users') renderUsers();
            if (pageId === 'products') renderProducts();
            if (pageId === 'sellers') renderSellers();
            if (pageId === 'categories') renderCategories();
            if (pageId === 'reports') renderReports();
        }

        // ================================================================
        //  SIDEBAR TOGGLE
        // ================================================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        function updateMsgBadge() {
            const messages = JSON.parse(localStorage.getItem('kn_messages') || '[]');
            const unread = messages.filter(m => m.receiverId === 'admin' && !m.read).length;
            document.getElementById('msgBadgeTop').textContent = unread;
        }

        // ================================================================
        //  INIT
        // ================================================================
        async function init() {
            // Check authentication
            const storedUser = localStorage.getItem('currentUser');
            if (storedUser) {
                try { currentUser = JSON.parse(storedUser); } catch (e) {}
            }
            token = localStorage.getItem('token') || null;

            if (!token || !currentUser) {
                showToast('Please login as admin', 'error');
                window.location.href = 'index.html';
                return;
            }
            if (currentUser.role !== 'admin') {
                showToast('Access denied. Admin only.', 'error');
                window.location.href = 'index.html';
                return;
            }

            updateAdminProfile();
            loadSettings();

            // Fetch data from API
            await fetchProducts();
            await fetchNotifications();

            // Render all sections
            renderDashboard();
            renderUsers();
            renderProducts();
            renderSellers();
            renderCategories();
            renderReports();
            renderNotifications();
            updateMsgBadge();

            // Event listeners
            window.addEventListener('resize', function() { if (window.innerWidth > 992) closeSidebar(); });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal-overlay.active').forEach(el => el.classList.remove('active'));
                    closeSidebar();
                }
            });

            console.log('✅ Admin Dashboard connected to backend API');
        }
        init();

        // ================================================================
        //  EXPOSE GLOBALS
        // ================================================================
        window.showPage = showPage;
        window.toggleSidebar = toggleSidebar;
        window.closeSidebar = closeSidebar;
        window.openAddUserModal = openAddUserModal;
        window.editUser = editUser;
        window.deleteUser = deleteUser;
        window.saveUser = saveUser;
        window.openAddProductModal = openAddProductModal;
        window.editProduct = editProduct;
        window.deleteProductHandler = deleteProductHandler;
        window.saveProduct = saveProduct;
        window.viewProduct = viewProduct;
        window.openAddSellerModal = openAddSellerModal;
        window.editSeller = editSeller;
        window.deleteSeller = deleteSeller;
        window.openAddCategoryModal = openAddCategoryModal;
        window.editCategory = editCategory;
        window.deleteCategory = deleteCategory;
        window.saveCategory = saveCategory;
        window.toggleNotificationPanel = toggleNotificationPanel;
        window.markNotifRead = markNotifRead;
        window.deleteNotif = deleteNotif;
        window.saveSettings = saveSettings;
        window.logout = logout;
        window.closeModal = closeModal;
        window.openModal = openModal;
        window.showToast = showToast;
        window.filterDashboardProducts = filterDashboardProducts;
    </script>
</body>
</html>
